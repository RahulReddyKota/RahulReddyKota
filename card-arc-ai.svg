<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="ARC AI: Local-first RAG assistant for Maryland housing law that cites 7 official sources in every answer.">
  <title>ARC AI</title>
  <defs>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="598" height="238" rx="16"/></clipPath>
  </defs>
  <style>
    .head { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #8B949E; }
    .title { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #F0F6FC; letter-spacing: -.5px; }
    .desc { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; fill: #C9D1D9; }
    .chip { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .meta { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #8B949E; }
    .cta { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; font-weight: 700; }
    .tiny { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 9px; }
    .in { animation: rise .7s ease-out both; }
    .in2 { animation: rise .7s .15s ease-out both; }
    .in3 { animation: rise .7s .3s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="600" height="240" fill="#0D1117"/>
    <rect width="600" height="240" fill="url(#glow)"/>
    <rect y="0" width="180" height="3" fill="url(#sweep)">
      <animate attributeName="x" values="-180;600" dur="3.5s" begin="0.4s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="598" height="238" rx="16" fill="none" stroke="#30363D"/>

  <g class="in">
    <path d="M30,24 h11 a2,2 0 0 1 2,2 v14 a2,2 0 0 1 -2,2 h-11 a2,2 0 0 1 -2,-2 v-14 a2,2 0 0 1 2,-2z M31,38 h10" fill="none" stroke="#8B949E" stroke-width="1.5"/>
    <text x="52" y="38" class="head">RahulReddyKota / ARC-AI-Augmented-Reasoning-Core</text>
    <text x="28" y="84" class="title">ARC AI</text>
  </g>
  <g class="in2">
    <text x="28" y="112" class="desc">Local-first RAG assistant for Maryland housing law</text>
    <text x="28" y="132" class="desc">that cites 7 official sources in every answer.</text>
  </g>
  <g class="in3"><g><rect x="28" y="146" width="110" height="26" rx="13" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".5"/><text x="83" y="163.5" text-anchor="middle" class="chip" fill="#22D3EE">3 local LLMs</text></g><g><rect x="146" y="146" width="110" height="26" rx="13" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".5"/><text x="200" y="163.5" text-anchor="middle" class="chip" fill="#22D3EE">9 NLP layers</text></g><g><rect x="263" y="146" width="161" height="26" rx="13" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".5"/><text x="344" y="163.5" text-anchor="middle" class="chip" fill="#22D3EE">hallucination evals</text></g></g>
  <line x1="28" y1="188" x2="572" y2="188" stroke="#21262D"/>
  <circle cx="34" cy="208" r="6" fill="#3572A5"/><text x="46" y="213" class="meta">Python</text>
  <text x="110" y="213" class="meta">ChromaDB · Ollama · Llama 3.1 · Mistral</text>
  <text x="572" y="213" text-anchor="end" class="cta" fill="#22D3EE">view repo →</text>
  
  <g transform="translate(468,58)">
    <rect x="0" y="0" width="110" height="110" rx="14" fill="#22D3EE" fill-opacity=".06" stroke="#22D3EE" stroke-opacity=".3"/>
    <g>
      <rect x="10" y="14" width="64" height="22" rx="8" fill="#21262D"/>
      <rect x="18" y="22" width="44" height="5" rx="2.5" fill="#8B949E"/>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.3;.9;1" dur="4s" repeatCount="indefinite"/>
      <rect x="36" y="44" width="64" height="40" rx="8" fill="#22D3EE" fill-opacity=".18" stroke="#22D3EE" stroke-opacity=".6"/>
      <rect x="44" y="52" width="46" height="4" rx="2" fill="#22D3EE"/>
      <rect x="44" y="60" width="38" height="4" rx="2" fill="#22D3EE" fill-opacity=".7"/>
      <rect x="44" y="68" width="26" height="4" rx="2" fill="#22D3EE" fill-opacity=".5"/>
    </g>
    <g opacity="0" class="tiny"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.45;.55;.9;1" dur="4s" repeatCount="indefinite"/>
      <rect x="36" y="90" width="22" height="13" rx="4" fill="#0D1117" stroke="#22D3EE"/><text x="47" y="99.5" text-anchor="middle" fill="#22D3EE">[1]</text>
      <rect x="62" y="90" width="22" height="13" rx="4" fill="#0D1117" stroke="#22D3EE"/><text x="73" y="99.5" text-anchor="middle" fill="#22D3EE">[4]</text>
    </g>
    <g fill="#22D3EE"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.22;.25;.97;1" dur="4s" repeatCount="indefinite"/>
      <circle cx="46" cy="62" r="3"><animate attributeName="opacity" values=".2;1;.2" dur=".9s" repeatCount="indefinite"/></circle>
      <circle cx="56" cy="62" r="3"><animate attributeName="opacity" values=".2;1;.2" dur=".9s" begin=".3s" repeatCount="indefinite"/></circle>
      <circle cx="66" cy="62" r="3"><animate attributeName="opacity" values=".2;1;.2" dur=".9s" begin=".6s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
