<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="Trading on Trends: FinBERT headline sentiment plus RSI, MACD and Bollinger signals to call next-day direction.">
  <title>Trading on Trends</title>
  <defs>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#86EFAC" stop-opacity="0"/><stop offset=".5" stop-color="#86EFAC"/><stop offset="1" stop-color="#86EFAC" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#86EFAC" stop-opacity=".18"/><stop offset="1" stop-color="#86EFAC" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="598" height="238" rx="16"/></clipPath>
  </defs>
  <style>
    .head { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #8B949E; }
    .title { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #F0F6FC; letter-spacing: -.5px; }
    .desc { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; fill: #C9D1D9; }
    .chip { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .meta { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #8B949E; }
    .cta { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; font-weight: 700; }
    .tiny { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 9px; }
    .in { animation: rise .7s ease-out both; }
    .in2 { animation: rise .7s .15s ease-out both; }
    .in3 { animation: rise .7s .3s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="600" height="240" fill="#0D1117"/>
    <rect width="600" height="240" fill="url(#glow)"/>
    <rect y="0" width="180" height="3" fill="url(#sweep)">
      <animate attributeName="x" values="-180;600" dur="3.5s" begin="1.2s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="598" height="238" rx="16" fill="none" stroke="#30363D"/>

  <g class="in">
    <path d="M30,24 h11 a2,2 0 0 1 2,2 v14 a2,2 0 0 1 -2,2 h-11 a2,2 0 0 1 -2,-2 v-14 a2,2 0 0 1 2,-2z M31,38 h10" fill="none" stroke="#8B949E" stroke-width="1.5"/>
    <text x="52" y="38" class="head">RahulReddyKota · project</text>
    <text x="28" y="84" class="title">Trading on Trends</text>
  </g>
  <g class="in2">
    <text x="28" y="112" class="desc">FinBERT headline sentiment plus RSI, MACD and</text>
    <text x="28" y="132" class="desc">Bollinger signals to call next-day direction.</text>
  </g>
  <g class="in3"><g><rect x="28" y="146" width="175" height="26" rx="13" fill="#86EFAC" fill-opacity=".1" stroke="#86EFAC" stroke-opacity=".5"/><text x="116" y="163.5" text-anchor="middle" class="chip" fill="#86EFAC">LSTM vs Random Forest</text></g><g><rect x="211" y="146" width="183" height="26" rx="13" fill="#86EFAC" fill-opacity=".1" stroke="#86EFAC" stroke-opacity=".5"/><text x="303" y="163.5" text-anchor="middle" class="chip" fill="#86EFAC">sentiment + technicals</text></g></g>
  <line x1="28" y1="188" x2="572" y2="188" stroke="#21262D"/>
  <circle cx="34" cy="208" r="6" fill="#3572A5"/><text x="46" y="213" class="meta">Python</text>
  <text x="110" y="213" class="meta">FinBERT · LSTM · Pandas · SQL</text>
  
  
  <g transform="translate(468,58)">
    <rect x="0" y="0" width="110" height="110" rx="14" fill="#86EFAC" fill-opacity=".06" stroke="#86EFAC" stroke-opacity=".3"/>
    <g stroke="#30363D"><line x1="10" y1="30" x2="100" y2="30"/><line x1="10" y1="55" x2="100" y2="55"/><line x1="10" y1="80" x2="100" y2="80"/></g>
    <path d="M10,80 L24,72 L36,76 L48,58 L60,64 L72,44 L84,50 L98,26" fill="none" stroke="#86EFAC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140" stroke-dashoffset="140">
      <animate attributeName="stroke-dashoffset" values="140;0;0;140" keyTimes="0;.45;.9;1" dur="4s" repeatCount="indefinite"/></path>
    <circle r="4.5" fill="#86EFAC" opacity="0">
      <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;.45;.9;1" calcMode="linear" path="M10,80 L24,72 L36,76 L48,58 L60,64 L72,44 L84,50 L98,26"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.9;1" dur="4s" repeatCount="indefinite"/></circle>
    <text x="96" y="100" text-anchor="end" class="tiny" fill="#86EFAC">▲ next-day</text>
  </g>
</svg>
