<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="Approved to ship. Let's build something that ships." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B4470" stroke-width="1"/>
    </pattern>
    <style>.t{font-family:'Bahnschrift','DIN Alternate','DIN Condensed','Roboto Condensed','Arial Narrow',Arial,sans-serif}</style>
  </defs>
  <rect width="1200" height="160" fill="#12355B"/>
  <rect width="1200" height="160" fill="url(#grid)"/>
  <rect x="14" y="14" width="1172" height="132" fill="none" stroke="#DCE6F0" stroke-width="1.5"/>

  <text x="60" y="72" class="t" font-size="32" font-weight="600" fill="#E6EEF6">Let's build something that ships.</text>
  <text x="62" y="102" class="t" font-size="16" fill="#A9C1DA">Open to data science, ML engineering, and data roles, and to research collaborations.</text>

  <!-- stamp -->
  <g transform="rotate(-7 1000 80)" class="t" fill="none" stroke="#F5A524">
    <rect x="890" y="46" width="220" height="68" rx="6" stroke-width="3"/>
    <rect x="898" y="54" width="204" height="52" rx="3" stroke-width="1.2"/>
    <text x="1000" y="84" text-anchor="middle" font-size="21" font-weight="700" fill="#F5A524" stroke="none" textLength="150" lengthAdjust="spacingAndGlyphs">approved to ship</text>
    <text x="1000" y="101" text-anchor="middle" font-size="12" fill="#F5A524" stroke="none">RRK · rev 2026.09</text>
  </g>
</svg>
