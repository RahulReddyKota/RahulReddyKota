<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="Job Market Analysis: AWS EMR + PySpark pipeline over millions of job postings, with skill and salary trends in Power BI.">
  <title>Job Market Analysis</title>
  <defs>
    <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#FCD34D" stop-opacity="0"/><stop offset=".5" stop-color="#FCD34D"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#FCD34D" stop-opacity=".18"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="598" height="238" rx="16"/></clipPath>
  </defs>
  <style>
    .head { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #8B949E; }
    .title { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #F0F6FC; letter-spacing: -.5px; }
    .desc { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; fill: #C9D1D9; }
    .chip { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .meta { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #8B949E; }
    .cta { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; font-weight: 700; }
    .tiny { font-family: 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 9px; }
    .in { animation: rise .7s ease-out both; }
    .in2 { animation: rise .7s .15s ease-out both; }
    .in3 { animation: rise .7s .3s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="600" height="240" fill="#0D1117"/>
    <rect width="600" height="240" fill="url(#glow)"/>
    <rect y="0" width="180" height="3" fill="url(#sweep)">
      <animate attributeName="x" values="-180;600" dur="3.5s" begin="0.8s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="598" height="238" rx="16" fill="none" stroke="#30363D"/>

  <g class="in">
    <path d="M30,24 h11 a2,2 0 0 1 2,2 v14 a2,2 0 0 1 -2,2 h-11 a2,2 0 0 1 -2,-2 v-14 a2,2 0 0 1 2,-2z M31,38 h10" fill="none" stroke="#8B949E" stroke-width="1.5"/>
    <text x="52" y="38" class="head">RahulReddyKota · project</text>
    <text x="28" y="84" class="title">Job Market Analysis</text>
  </g>
  <g class="in2">
    <text x="28" y="112" class="desc">AWS EMR + PySpark pipeline over millions of job</text>
    <text x="28" y="132" class="desc">postings, with skill and salary trends in Power BI.</text>
  </g>
  <g class="in3"><g><rect x="28" y="146" width="168" height="26" rx="13" fill="#FCD34D" fill-opacity=".1" stroke="#FCD34D" stroke-opacity=".5"/><text x="112" y="163.5" text-anchor="middle" class="chip" fill="#FCD34D">millions of postings</text></g><g><rect x="204" y="146" width="132" height="26" rx="13" fill="#FCD34D" fill-opacity=".1" stroke="#FCD34D" stroke-opacity=".5"/><text x="270" y="163.5" text-anchor="middle" class="chip" fill="#FCD34D">partitioned ORC</text></g><g><rect x="344" y="146" width="80" height="26" rx="13" fill="#FCD34D" fill-opacity=".1" stroke="#FCD34D" stroke-opacity=".5"/><text x="384" y="163.5" text-anchor="middle" class="chip" fill="#FCD34D">Power BI</text></g></g>
  <line x1="28" y1="188" x2="572" y2="188" stroke="#21262D"/>
  <circle cx="34" cy="208" r="6" fill="#3572A5"/><text x="46" y="213" class="meta">Python</text>
  <text x="110" y="213" class="meta">PySpark · Hive · AWS EMR · S3</text>
  
  
  <g transform="translate(468,58)">
    <rect x="0" y="0" width="110" height="110" rx="14" fill="#FCD34D" fill-opacity=".06" stroke="#FCD34D" stroke-opacity=".3"/>
    <line x1="10" y1="96.5" x2="100" y2="96.5" stroke="#484F58"/>
    <rect x="14" width="12" rx="3" fill="#FCD34D" fill-opacity="0.45" y="96" height="0">
        <animate attributeName="height" values="0;38;38;0" keyTimes="0;.3;.85;1" dur="4s" begin="0.00s" repeatCount="indefinite"/>
        <animate attributeName="y" values="96;58;58;96" keyTimes="0;.3;.85;1" dur="4s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="32" width="12" rx="3" fill="#FCD34D" fill-opacity="0.56" y="96" height="0">
        <animate attributeName="height" values="0;62;62;0" keyTimes="0;.3;.85;1" dur="4s" begin="0.15s" repeatCount="indefinite"/>
        <animate attributeName="y" values="96;34;34;96" keyTimes="0;.3;.85;1" dur="4s" begin="0.15s" repeatCount="indefinite"/></rect><rect x="50" width="12" rx="3" fill="#FCD34D" fill-opacity="0.67" y="96" height="0">
        <animate attributeName="height" values="0;48;48;0" keyTimes="0;.3;.85;1" dur="4s" begin="0.30s" repeatCount="indefinite"/>
        <animate attributeName="y" values="96;48;48;96" keyTimes="0;.3;.85;1" dur="4s" begin="0.30s" repeatCount="indefinite"/></rect><rect x="68" width="12" rx="3" fill="#FCD34D" fill-opacity="0.78" y="96" height="0">
        <animate attributeName="height" values="0;80;80;0" keyTimes="0;.3;.85;1" dur="4s" begin="0.45s" repeatCount="indefinite"/>
        <animate attributeName="y" values="96;16;16;96" keyTimes="0;.3;.85;1" dur="4s" begin="0.45s" repeatCount="indefinite"/></rect><rect x="86" width="12" rx="3" fill="#FCD34D" fill-opacity="0.89" y="96" height="0">
        <animate attributeName="height" values="0;70;70;0" keyTimes="0;.3;.85;1" dur="4s" begin="0.60s" repeatCount="indefinite"/>
        <animate attributeName="y" values="96;26;26;96" keyTimes="0;.3;.85;1" dur="4s" begin="0.60s" repeatCount="indefinite"/></rect>
  </g>
</svg>
