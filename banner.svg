<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Rahul Reddy Kota. Blueprint of a data pipeline flowing from raw data through transform and training into production." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B4470" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M120 0H0V120" fill="none" stroke="#24538A" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:'Bahnschrift','DIN Alternate','DIN Condensed','Roboto Condensed','Arial Narrow',Arial,sans-serif;fill:#E6EEF6}
      .dim{fill:#A9C1DA}
      .line{fill:#12355B;stroke:#DCE6F0;stroke-width:2}
      .pipe{fill:none;stroke:#DCE6F0;stroke-width:2}
      .p{fill:#8FA9C4;animation:flow 7s linear infinite}
      @keyframes flow{
        0%{transform:translateX(0);fill:#8FA9C4}
        29.9%{fill:#8FA9C4}
        30%{fill:#F5A524}
        63.2%{fill:#F5A524}
        63.3%{fill:#7FD6A4}
        100%{transform:translateX(900px);fill:#7FD6A4}
      }
      @media (prefers-reduced-motion:reduce){.p{animation:none}}
    </style>
  </defs>

  <!-- sheet -->
  <rect width="1200" height="320" fill="#12355B"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#major)"/>
  <rect x="14" y="14" width="1172" height="292" fill="none" stroke="#DCE6F0" stroke-width="1.5"/>
  <rect x="24" y="24" width="1152" height="272" fill="none" stroke="#DCE6F0" stroke-width="0.75" opacity="0.55"/>
  <g stroke="#DCE6F0" stroke-width="1" opacity="0.7">
    <path d="M254 14V24M494 14V24M734 14V24M974 14V24M254 296V306M494 296V306M734 296V306M974 296V306"/>
  </g>

  <!-- name -->
  <text x="60" y="96" class="t" font-size="60" font-weight="600" letter-spacing="0.5">Rahul Reddy Kota</text>
  <text x="62" y="132" class="t dim" font-size="19">Data scientist and ML engineer building pipelines that end in production.</text>

  <!-- title block -->
  <g class="t" font-size="14">
    <rect x="870" y="40" width="290" height="96" fill="#12355B" stroke="#DCE6F0" stroke-width="1.5"/>
    <path d="M870 72H1160M870 104H1160M946 40V136" stroke="#DCE6F0" stroke-width="1" opacity="0.8"/>
    <text x="882" y="61" class="dim">drawing</text><text x="958" y="61">rahul-reddy-kota</text>
    <text x="882" y="93" class="dim">site</text><text x="958" y="93">UMBC, Baltimore MD</text>
    <text x="882" y="125" class="dim">rev</text><text x="958" y="125">2026.09</text>
  </g>

  <!-- pipe runs -->
  <path class="pipe" d="M144 206H372M144 222H372M428 206H658M428 222H658M742 206H1030M742 222H1030"/>
  <g stroke="#DCE6F0" stroke-width="3">
    <path d="M250 200V228M540 200V228M880 200V228"/>
  </g>

  <!-- data packets -->
  <g>
    <circle class="p" cx="130" cy="214" r="4.5" style="animation-delay:0s"/>
    <circle class="p" cx="130" cy="214" r="4.5" style="animation-delay:-1s"/>
    <circle class="p" cx="130" cy="214" r="4.5" style="animation-delay:-2s"/>
    <circle class="p" cx="130" cy="214" r="4.5" style="animation-delay:-3s"/>
    <circle class="p" cx="130" cy="214" r="4.5" style="animation-delay:-4s"/>
    <circle class="p" cx="130" cy="214" r="4.5" style="animation-delay:-5s"/>
    <circle class="p" cx="130" cy="214" r="4.5" style="animation-delay:-6s"/>
  </g>

  <!-- 1 ingest: raw data tank -->
  <path class="line" d="M64 178Q64 170 104 170Q144 170 144 178V246Q144 254 104 254Q64 254 64 246Z"/>
  <path d="M64 178Q104 186 144 178" fill="none" stroke="#DCE6F0" stroke-width="1.5"/>
  <g fill="#8FA9C4">
    <circle cx="84" cy="200" r="3"/><circle cx="110" cy="196" r="2.5"/><circle cx="126" cy="214" r="3"/>
    <circle cx="94" cy="222" r="2.5"/><circle cx="118" cy="236" r="3"/><circle cx="80" cy="240" r="2.5"/>
    <circle cx="104" cy="210" r="2"/><circle cx="130" cy="244" r="2"/>
  </g>

  <!-- 2 transform: valve -->
  <path class="line" d="M372 198L400 214L372 230ZM428 198L400 214L428 230Z"/>
  <path d="M400 214V184M386 184H414" fill="none" stroke="#DCE6F0" stroke-width="2.5"/>

  <!-- 3 train: vessel with network -->
  <circle class="line" cx="700" cy="214" r="42"/>
  <g stroke="#5B7FA6" stroke-width="0.9">
    <path d="M680 200L700 194M680 200L700 207M680 200L700 221M680 200L700 234M680 214L700 194M680 214L700 207M680 214L700 221M680 214L700 234M680 228L700 194M680 228L700 207M680 228L700 221M680 228L700 234M700 194L720 206M700 207L720 206M700 221L720 206M700 234L720 206M700 194L720 222M700 207L720 222M700 221L720 222M700 234L720 222"/>
  </g>
  <g fill="#DCE6F0">
    <circle cx="680" cy="200" r="3.2"/><circle cx="680" cy="214" r="3.2"/><circle cx="680" cy="228" r="3.2"/>
    <circle cx="700" cy="194" r="3.2"/><circle cx="700" cy="207" r="3.2"/><circle cx="700" cy="221" r="3.2"/><circle cx="700" cy="234" r="3.2"/>
    <circle cx="720" cy="206" r="3.2"/><circle cx="720" cy="222" r="3.2"/>
  </g>

  <!-- 4 ship: production -->
  <rect class="line" x="1030" y="188" width="120" height="52"/>
  <text x="1090" y="219" class="t" font-size="17" text-anchor="middle">production</text>

  <!-- station tags -->
  <g class="t" font-size="15">
    <circle cx="74" cy="277" r="10" fill="none" stroke="#DCE6F0" stroke-width="1.5"/><text x="74" y="282" text-anchor="middle" font-size="13">1</text><text x="92" y="282">ingest</text>
    <circle cx="362" cy="277" r="10" fill="none" stroke="#DCE6F0" stroke-width="1.5"/><text x="362" y="282" text-anchor="middle" font-size="13">2</text><text x="380" y="282">transform</text>
    <circle cx="676" cy="277" r="10" fill="none" stroke="#DCE6F0" stroke-width="1.5"/><text x="676" y="282" text-anchor="middle" font-size="13">3</text><text x="694" y="282">train</text>
    <circle cx="1062" cy="277" r="10" fill="none" stroke="#DCE6F0" stroke-width="1.5"/><text x="1062" y="282" text-anchor="middle" font-size="13">4</text><text x="1080" y="282">ship</text>
  </g>
</svg>
